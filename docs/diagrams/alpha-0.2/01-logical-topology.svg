<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One trusted fabric.</title><desc id="desc">Four members (OMEGA, Alpha, Iota, and Tarragon) use mutual TLS 1.3 with the Slipstream fabric owner. The owner&#x27;s single runtime contains membership authority, local inventory, and Positronic&#x27;s aggregated telemetry. A browser on OMEGA reads only OMEGA&#x27;s loopback API with a separate browser token.</desc>
