<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Private reachability.</title><desc id="desc">Alpha, Iota, and Tarragon reach Slipstream using a reverse SSH forward into OMEGA, then a local SSH forward to Slipstream&#x27;s loopback coordinator. OMEGA initiates both SSH connections. Nucleus mutual TLS remains end-to-end between member and owner, and no public Nucleus listener is exposed.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FCFDFC" stroke="none" stroke-width="1"/>
<text x="72" y="73" fill="#142E30" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">nucleus</text>
<circle cx="174" cy="69" r="4" fill="#168565" stroke="none" stroke-width="1"/>
<text x="1528" y="69" fill="#536A6B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">ALPHA 0.2  /  PROTOTYPE TRANSPORT</text>
<text x="72" y="145" fill="#142E30" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="600" text-anchor="start">Private reachability.</text>
<text x="72" y="189" fill="#536A6B" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">End-to-end node identity.</text>
<line x1="72" y1="214" x2="1528" y2="214" stroke="#DCE6E3" stroke-width="2" stroke-linecap="round"/>
<line x1="72" y1="808" x2="1528" y2="808" stroke="#DCE6E3" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="847" fill="#536A6B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">IDENTITY, MEMBERSHIP &amp; TELEMETRY</text>
<text x="72" y="877" fill="#536A6B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Implemented prototype  /  November 01, 2026</text>
<text x="1528" y="859" fill="#536A6B" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="end">02 / 03</text>
