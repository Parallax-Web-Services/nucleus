<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Explicit pairing.</title><desc id="desc">The owner sends a signed expiring one-use invitation. The joining node accepts it and returns a signed certificate request. The owner inspects and approves, then issues a signed grant and membership certificate. The joining node verifies and accepts membership before mutual TLS telemetry begins. Private keys remain on their originating machines.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#0C1317" stroke="none" stroke-width="1"/>
<text x="72" y="73" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">nucleus</text>
<circle cx="174" cy="69" r="4" fill="#62DDB3" stroke="none" stroke-width="1"/>
<text x="1528" y="69" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">ALPHA 0.2  /  SECURE ENROLLMENT</text>
<text x="72" y="145" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="600" text-anchor="start">Explicit pairing.</text>
<text x="72" y="189" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Verified at both ends.</text>
<line x1="72" y1="214" x2="1528" y2="214" stroke="#30454A" stroke-width="2" stroke-linecap="round"/>
<line x1="72" y1="808" x2="1528" y2="808" stroke="#30454A" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="847" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">IDENTITY, MEMBERSHIP &amp; TELEMETRY</text>
<text x="72" y="877" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Implemented prototype  /  November 01, 2026</text>
<text x="1528" y="859" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="end">03 / 03</text>
<rect x="72" y="242" width="414" height="96" rx="16" fill="#131F24" stroke="#30454A" stroke-width="1"/>
<text x="98" y="281" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Slipstream / fabric owner</text>
<text x="98" y="313" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Node key + separate fabric CA key</text>
<rect x="1114" y="242" width="414" height="96" rx="16" fill="#131F24" stroke="#30454A" stroke-width="1"/>
<text x="1140" y="281" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Joining node</text>
<text x="1140" y="313" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Own persistent identity key</text>
<line x1="279" y1="340" x2="279" y2="755" stroke="#30454A" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8"/>
<line x1="1321" y1="340" x2="1321" y2="755" stroke="#30454A" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8"/>
<text x="800" y="269" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">TRUSTED OUT-OF-BAND EXCHANGE</text>
<text x="800" y="302" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Signed documents travel through an existing trusted channel.</text>
<text x="800" y="381" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">01   Signed invitation</text>
<line x1="279" y1="401" x2="1321" y2="401" stroke="#62DDB3" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="1321,401 1310.0,396.0 1310.0,406.0" fill="#62DDB3"/>
<text x="800" y="430" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Pinned authority + expiring, one-use secret</text>
<rect x="1183" y="423" width="276" height="37" rx="10" fill="#16392F" stroke="none" stroke-width="1"/>
<text x="1321.0" y="448" fill="#62DDB3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Accept invitation</text>
<text x="800" y="493" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">02   Signed certificate request</text>
<line x1="1321" y1="513" x2="279" y2="513" stroke="#62DDB3" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="279,513 290.0,518.0 290.0,508.0" fill="#62DDB3"/>
<text x="800" y="542" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Joining node proves possession of its key</text>
<rect x="141" y="535" width="276" height="37" rx="10" fill="#16392F" stroke="none" stroke-width="1"/>
<text x="279.0" y="560" fill="#62DDB3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Owner inspects + approves</text>
<text x="800" y="605" fill="#E8F2EF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">03   Signed grant + membership certificate</text>
<line x1="279" y1="625" x2="1321" y2="625" stroke="#62DDB3" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="1321,625 1310.0,620.0 1310.0,630.0" fill="#62DDB3"/>
<text x="800" y="654" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Bound to the pending request and joining node</text>
<rect x="1167" y="647" width="308" height="37" rx="10" fill="#16392F" stroke="none" stroke-width="1"/>
<text x="1321.0" y="672" fill="#62DDB3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Verify + accept membership</text>
<rect x="279" y="706" width="1042" height="49" rx="13" fill="#16392F" stroke="none" stroke-width="1"/>
<text x="800" y="738" fill="#62DDB3" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">04   Mutual TLS telemetry begins</text>
<text x="800" y="784" fill="#AEC2BF" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Private keys stay on their originating nodes. Certificates establish membership.</text>
</svg>
